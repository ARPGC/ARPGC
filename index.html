<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoCampus - Maintenance</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                        jakarta: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: { 500: '#10B981', 600: '#059669' }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col relative overflow-hidden selection:bg-brand-500 selection:text-white">

    <div class="absolute inset-0 bg-grid pointer-events-none z-0"></div>
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-brand-500/20 rounded-full blur-[100px] pointer-events-none z-0 animate-pulse-slow"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-emerald-600/10 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <main class="relative z-10 flex-grow flex items-center justify-center p-6">
        <div class="glass-panel p-8 md:p-12 rounded-3xl shadow-2xl max-w-lg w-full text-center transform transition-all">
            
            <div class="relative w-24 h-24 mx-auto mb-8 animate-float">
                <div class="absolute inset-0 bg-brand-100 rounded-2xl rotate-6"></div>
                <div class="absolute inset-0 bg-brand-500 rounded-2xl -rotate-3 flex items-center justify-center shadow-lg shadow-brand-500/30">
                    <i data-lucide="rocket" class="w-10 h-10 text-white"></i>
                </div>
                <i data-lucide="sparkles" class="absolute -top-4 -right-4 w-6 h-6 text-yellow-400"></i>
            </div>

            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-amber-100 text-amber-700 text-xs font-bold uppercase tracking-widest mb-6 border border-amber-200">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                </span>
                System Upgrade in Progress
            </div>

            <h1 class="text-3xl md:text-4xl font-black font-jakarta mb-4 tracking-tight">EcoCampus <span class="text-brand-500">2.0</span></h1>
            
            <p class="text-gray-600 leading-relaxed mb-8">
                We're currently planting the seeds for a massive upgrade! The platform is undergoing maintenance to bring you new features, better performance, and a greener experience. 
            </p>

            <div class="bg-gray-100 rounded-2xl p-4 flex flex-col items-center justify-center border border-gray-200">
                <p class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                    <i data-lucide="clock" class="w-4 h-4 text-brand-500"></i>
                    We'll be back online shortly.
                </p>
                <div class="w-full h-2 bg-gray-200 rounded-full mt-3 overflow-hidden">
                    <div class="h-full bg-brand-500 rounded-full w-[3%] relative">
                        <div class="absolute inset-0 bg-white/20 animate-[slide_2s_linear_infinite]" style="background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent); background-size: 1rem 1rem;"></div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <footer class="relative z-10 pb-8 text-center px-6">
        <p class="text-sm text-gray-500 mb-3">Need urgent assistance?</p>
        <div class="flex items-center justify-center gap-4">
            <a href="mailto:greenclubbkbirlanightcollege@gmail.com" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white shadow-sm border border-gray-200 text-sm font-semibold hover:text-brand-500 transition-colors active:scale-95">
                <i data-lucide="mail" class="w-4 h-4"></i> Email Support
            </a>
            <a href="https://instagram.com/ecocampus_app" target="_blank" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white shadow-sm border border-gray-200 text-sm font-semibold hover:text-pink-500 transition-colors active:scale-95">
                <i data-lucide="instagram" class="w-4 h-4"></i> Updates
            </a>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
